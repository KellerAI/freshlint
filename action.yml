name: freshlint
description: Memory honesty linter. Catches freshness laundering in markdown agent memory and knowledge bases.
author: Keller AI
branding:
  icon: check-circle
  color: green

inputs:
  mode:
    description: >-
      "diff" (BASE...HEAD), "staged", "full", or "auto" (diff on pull_request events
      when a base is known, full otherwise).
    required: false
    default: auto
  base:
    description: Base revision for diff mode. Defaults to the pull request base SHA.
    required: false
    default: ""
  head:
    description: Head revision for diff mode. Defaults to the pull request head SHA, then github.sha.
    required: false
    default: ""
  paths:
    description: Space-separated files or directories to limit the check to.
    required: false
    default: ""
  working-directory:
    description: Directory to run in (where your .freshlint.toml lives).
    required: false
    default: "."
  format:
    description: Output format (github, text or json).
    required: false
    default: github
  strict:
    description: Fail on warnings too ("true" or "false").
    required: false
    default: "false"
  today:
    description: Evaluate dates as of this YYYY-MM-DD (for reproducible runs).
    required: false
    default: ""
  python-version:
    description: Python version used to run freshlint.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install freshlint
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Run freshlint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Inputs are passed through the environment, never interpolated into the script.
        FL_MODE: ${{ inputs.mode }}
        FL_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        FL_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
        FL_EVENT: ${{ github.event_name }}
        FL_FORMAT: ${{ inputs.format }}
        FL_STRICT: ${{ inputs.strict }}
        FL_TODAY: ${{ inputs.today }}
        FL_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        mode="$FL_MODE"
        if [[ "$mode" == "auto" ]]; then
          if [[ "$FL_EVENT" == pull_request* && -n "$FL_BASE" ]]; then mode="diff"; else mode="full"; fi
        fi
        args=(check --format "$FL_FORMAT")
        case "$mode" in
          diff)
            if [[ -z "$FL_BASE" ]]; then
              echo "::error title=freshlint::diff mode needs a base revision"
              exit 2
            fi
            args+=(--diff "$FL_BASE...$FL_HEAD")
            ;;
          staged) args+=(--staged) ;;
          full) ;;
          *)
            echo "::error title=freshlint::unknown mode '$mode'"
            exit 2
            ;;
        esac
        if [[ "$FL_STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ -n "$FL_TODAY" ]]; then args+=(--today "$FL_TODAY"); fi
        if [[ -n "$FL_PATHS" ]]; then
          read -r -a extra <<<"$FL_PATHS"
          args+=("${extra[@]}")
        fi
        freshlint "${args[@]}"
