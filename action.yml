name: freshlint
description: Memory honesty linter. Catches freshness laundering in markdown agent memory and knowledge bases.
author: Keller AI
branding:
  icon: check-circle
  color: green

inputs:
  mode:
    description: >-
      "diff" (BASE...HEAD), "staged", "full", or "auto" (diff on pull_request events
      when a base is known, full otherwise).
    required: false
    default: auto
  base:
    description: Base revision for diff mode. Defaults to the pull request base SHA.
    required: false
    default: ""
  head:
    description: Head revision for diff mode. Defaults to the pull request head SHA, then github.sha.
    required: false
    default: ""
  paths:
    description: Space-separated files or directories to limit the check to.
    required: false
    default: ""
  working-directory:
    description: Directory to run in (where your .freshlint.toml lives).
    required: false
    default: "."
  format:
    description: Output format (github, text or json).
    required: false
    default: github
  strict:
    description: Fail on warnings too ("true" or "false").
    required: false
    default: "false"
  today:
    description: Evaluate dates as of this YYYY-MM-DD (for reproducible runs).
    required: false
    default: ""
  python-version:
    description: Python version used to run freshlint.
    required: false
    default: "3.12"
  team:
    description: >-
      Opt in to freshlint Team ("true" or "false"). When "true", after the check the action
      uploads a run summary (file paths, line numbers, rule ids, counts and static rule
      summaries; never file contents or finding messages) to team-url, authenticated with a
      GitHub Actions OIDC token. Needs "permissions: id-token: write". After a successful
      upload, the run's comparison with the default branch (new and fixed findings, and the
      trend) is added to the job summary. When "false" (the default) the upload step does not
      run: nothing is uploaded and no request is made.
    required: false
    default: "false"
  team-url:
    description: The freshlint Team ingest URL (https). Required when team is "true".
    required: false
  team-audience:
    description: >-
      Audience of the GitHub OIDC token requested for the upload. The freshlint Team service
      only accepts tokens issued for this audience; change it only if the service tells you to.
    required: false
    default: freshlint-team

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install freshlint
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Run freshlint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Inputs are passed through the environment, never interpolated into the script.
        FL_MODE: ${{ inputs.mode }}
        FL_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        FL_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
        FL_EVENT: ${{ github.event_name }}
        FL_FORMAT: ${{ inputs.format }}
        FL_STRICT: ${{ inputs.strict }}
        FL_TODAY: ${{ inputs.today }}
        FL_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        . "$GITHUB_ACTION_PATH/scripts/build_args.sh" "$FL_FORMAT"
        freshlint "${FRESHLINT_ARGS[@]}"

    # Opt-in only: with the default team: false this step is skipped, so nothing runs and no
    # network request is made. It never changes the check result (continue-on-error).
    - name: Upload run summary to freshlint Team
      if: ${{ !cancelled() && inputs.team == 'true' }}
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FL_MODE: ${{ inputs.mode }}
        FL_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        FL_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
        FL_EVENT: ${{ github.event_name }}
        FL_STRICT: ${{ inputs.strict }}
        FL_TODAY: ${{ inputs.today }}
        FL_PATHS: ${{ inputs.paths }}
        FL_TEAM_URL: ${{ inputs.team-url }}
        FL_TEAM_AUDIENCE: ${{ inputs.team-audience }}
        # Event metadata for the comparison with the default branch (empty when absent).
        FL_TEAM_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        FL_TEAM_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FL_TEAM_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/team_upload.sh"
